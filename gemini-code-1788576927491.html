<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&display=swap');

    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --accent: #38bdf8;
      --panel-bg: rgba(30, 41, 59, 0.95);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Outfit', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    .hub-container {
      text-align: center;
      background: var(--panel-bg);
      padding: 50px 70px;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    p {
      font-size: 1.1rem;
      font-weight: 300;
      margin-bottom: 30px;
      opacity: 0.8;
    }

    .game-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .game-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 15px 30px;
      font-size: 1.3rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      display: block;
    }

    .game-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--text-color);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: var(--accent);
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="hub-container">
    <h1>Web Arcade</h1>
    <p>Select a game to play:</p>
    
    <div class="game-links">
      <a href="coastline/index.html" class="game-btn">Coastline Catch</a>
      <a href="apex/index.html" class="game-btn btn-secondary">Apex Command</a>
    </div>
  </div>

</body>
</html>
